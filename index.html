<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة سهل — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-l:#E8C96B;--gold-d:#A8892E;
  --bg:#080C0E;--bg2:#0D1418;--bg3:#111820;--bg4:#161E26;--bg5:#1C2530;
  --b1:#1E2D38;--b2:#243040;--b3:#2E3D4E;
  --text:#F0F4F8;--t2:#A8B8C8;--t3:#607080;
  --green:#10B981;--blue:#3B82F6;--purple:#8B5CF6;--red:#EF4444;--orange:#F59E0B;
}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg2);border-left:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;right:0;z-index:50;transition:transform .3s}
.main{flex:1;margin-right:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--bg2);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:40}
.content{flex:1;padding:28px;overflow-y:auto}

/* ── SIDEBAR ── */
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#0D0A00;flex-shrink:0}
.sb-logo-text{font-size:17px;font-weight:800}
.sb-role-switcher{padding:12px 14px;border-bottom:1px solid var(--b1)}
.role-pills{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:2px}
.role-pill{flex:1;padding:7px 4px;border-radius:8px;font-size:11px;font-weight:700;color:var(--t3);transition:all .2s;text-align:center}
.role-pill.active{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0D0A00}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.sb-section{padding:10px 14px 4px;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--t2);transition:all .2s;cursor:pointer;border-radius:0;position:relative;margin:1px 8px;border-radius:10px}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:rgba(201,168,76,.1);color:var(--gold)}
.sb-item.active::before{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--gold);border-radius:2px}
.sb-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-badge{margin-right:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px}
.sb-badge-gold{margin-right:auto;background:var(--gold);color:#0D0A00;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px}
.sb-user{padding:14px 16px;border-top:1px solid var(--b1)}
.sb-user-inner{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:12px;cursor:pointer}
.sb-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#0D0A00;flex-shrink:0}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:11px;color:var(--t3)}

/* ── TOPBAR ── */
.topbar-title{font-size:17px;font-weight:800}
.topbar-breadcrumb{font-size:12px;color:var(--t3)}
.topbar-actions{margin-right:auto;display:flex;align-items:center;gap:10px}
.tb-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s;position:relative}
.tb-btn:hover{border-color:var(--b2)}
.tb-notif{position:absolute;top:4px;left:4px;width:8px;height:8px;background:var(--red);border-radius:50%;border:1.5px solid var(--bg2)}
.tb-search{flex:1;max-width:320px;position:relative}
.tb-search input{width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:10px;padding:8px 12px 8px 36px;font-size:13px;color:var(--text);font-family:'Cairo',sans-serif;outline:none;transition:border-color .2s}
.tb-search input:focus{border-color:rgba(201,168,76,.4)}
.tb-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--t3)}

/* ── CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--bg3);border:1px solid var(--b1);border-radius:16px;padding:20px;transition:all .3s;cursor:default}
.kpi-card:hover{border-color:var(--b2);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.kpi-trend{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.kpi-trend.up{background:rgba(16,185,129,.12);color:var(--green)}
.kpi-trend.down{background:rgba(239,68,68,.12);color:var(--red)}
.kpi-val{font-size:26px;font-weight:800;margin-bottom:4px}
.kpi-lbl{font-size:12px;color:var(--t3)}

/* ── CHARTS ── */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg3);border:1px solid var(--b1);border-radius:16px;padding:20px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-size:15px;font-weight:700}
.chart-sub{font-size:12px;color:var(--t3);margin-top:2px}
.chart-area{height:200px;position:relative}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:100%;padding-top:10px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bar{width:100%;border-radius:6px 6px 0 0;transition:all 1s ease;min-height:4px;cursor:pointer;position:relative}
.bar:hover{opacity:.8;transform:scaleY(1.02);transform-origin:bottom}
.bar-lbl{font-size:10px;color:var(--t3);white-space:nowrap}
.bar-val{font-size:10px;font-weight:700;color:var(--t2)}
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px}
.donut{position:relative;width:120px;height:120px}
.donut svg{transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-val{font-size:20px;font-weight:800}
.donut-lbl{font-size:10px;color:var(--t3)}
.donut-legend{display:flex;flex-direction:column;gap:8px;width:100%}
.donut-item{display:flex;align-items:center;gap:8px;font-size:12px}
.donut-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ── TABLES ── */
.table-card{background:var(--bg3);border:1px solid var(--b1);border-radius:16px;overflow:hidden;margin-bottom:24px}
.table-header{padding:18px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:right;font-size:11px;font-weight:700;color:var(--t3);background:var(--bg4);border-bottom:1px solid var(--b1);white-space:nowrap}
td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--b1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.td-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#0D0A00;flex-shrink:0}
.td-thumb{display:flex;align-items:center;gap:10px}
.td-name{font-size:13px;font-weight:600}
.td-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* ── BADGES ── */
.status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.status-green{background:rgba(16,185,129,.12);color:var(--green)}
.status-yellow{background:rgba(201,168,76,.12);color:var(--gold)}
.status-red{background:rgba(239,68,68,.12);color:var(--red)}
.status-blue{background:rgba(59,130,246,.12);color:var(--blue)}
.status-purple{background:rgba(139,92,246,.12);color:var(--purple)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;transition:all .2s;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#0D0A00}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,168,76,.3)}
.btn-outline{border:1.5px solid var(--b2);color:var(--t2);background:transparent}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-ghost{color:var(--t2);background:var(--bg4);border:1px solid var(--b1)}
.btn-ghost:hover{background:var(--bg5);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.btn-success:hover{background:rgba(16,185,129,.2)}

/* ── PROGRESS ── */
.prog-bar{height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width 1.2s ease}

/* ── STARS ── */
.stars{color:var(--gold);letter-spacing:1px}

/* ── COURSE CARD (instructor) ── */
.ic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.ic-card{background:var(--bg3);border:1px solid var(--b1);border-radius:16px;overflow:hidden;transition:all .3s}
.ic-card:hover{border-color:var(--b2);transform:translateY(-3px)}
.ic-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.ic-body{padding:16px}
.ic-title{font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.4}
.ic-meta{display:flex;gap:12px;font-size:11px;color:var(--t3);margin-bottom:12px}
.ic-actions{display:flex;gap:6px}

/* ── CERT CARD ── */
.cert-card{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.03));border:1px solid rgba(201,168,76,.2);border-radius:16px;padding:20px;display:flex;gap:16px;align-items:center;margin-bottom:12px;transition:all .3s}
.cert-card:hover{border-color:rgba(201,168,76,.4);transform:translateX(-4px)}
.cert-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.cert-title{font-size:14px;font-weight:700;margin-bottom:4px}
.cert-meta{font-size:12px;color:var(--t3)}
.cert-num{font-size:11px;color:var(--gold);font-family:monospace;margin-top:4px}

/* ── ENROLLED COURSE ── */
.ec-card{background:var(--bg3);border:1px solid var(--b1);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:10px;transition:all .3s;cursor:pointer}
.ec-card:hover{border-color:var(--b2);background:var(--bg4)}
.ec-thumb{width:64px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.ec-title{font-size:14px;font-weight:700;margin-bottom:6px}
.ec-progress{font-size:11px;color:var(--t3);margin-top:6px;display:flex;justify-content:space-between}
.ec-continue{margin-right:auto;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.25);cursor:pointer;white-space:nowrap;transition:all .2s}
.ec-continue:hover{background:var(--gold);color:#0D0A00}

/* ── NOTIFICATIONS ── */
.notif-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--b1)}
.notif-item:last-child{border-bottom:none}
.notif-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.notif-text{font-size:13px;line-height:1.5}
.notif-time{font-size:11px;color:var(--t3);margin-top:4px}

/* ── SECTION PANELS ── */
.panel{display:none}
.panel.active{display:block}

/* ── MINI STAT ROW ── */
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.mini-stat{background:var(--bg4);border:1px solid var(--b1);border-radius:12px;padding:14px;text-align:center}
.mini-stat-v{font-size:20px;font-weight:800;margin-bottom:2px}
.mini-stat-l{font-size:11px;color:var(--t3)}

/* ── APPROVAL ROW ── */
.approval-row{padding:16px;border-bottom:1px solid var(--b1);display:flex;gap:14px;align-items:center}
.approval-row:last-child{border-bottom:none}
.appr-thumb{width:72px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.appr-actions{display:flex;gap:6px;margin-right:auto}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--b2);border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;transition:all .35s;opacity:0;white-space:nowrap;pointer-events:none}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .sidebar{transform:translateX(240px)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .ic-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .kpi-grid,.mini-stats{grid-template-columns:1fr 1fr}
  .ic-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- ══ SIDEBAR ══ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">س</div>
    <span class="sb-logo-text">منصة سهل</span>
  </div>

  <!-- Role Switcher -->
  <div class="sb-role-switcher">
    <div class="role-pills">
      <div class="role-pill active" id="pill-admin" onclick="switchRole('admin')">إدارة</div>
      <div class="role-pill" id="pill-instructor" onclick="switchRole('instructor')">مدرّب</div>
      <div class="role-pill" id="pill-student" onclick="switchRole('student')">طالب</div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sb-nav" id="sb-nav"></nav>

  <!-- User -->
  <div class="sb-user">
    <div class="sb-user-inner">
      <div class="sb-avatar" id="sb-avatar" style="background:linear-gradient(135deg,#EF4444,#F59E0B)">م</div>
      <div class="sb-user-info">
        <div class="sb-user-name" id="sb-name">محمد الإداري</div>
        <div class="sb-user-role" id="sb-role-txt">مدير النظام</div>
      </div>
      <span style="font-size:18px;color:var(--t3)">⚙️</span>
    </div>
  </div>
</aside>

<!-- ══ MAIN ══ -->
<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <button onclick="toggleSidebar()" style="font-size:20px;color:var(--t2);margin-left:4px;display:none" id="menu-btn">☰</button>
    <div>
      <div class="topbar-title" id="page-title">نظرة عامة</div>
      <div class="topbar-breadcrumb" id="page-bread">لوحة الإدارة</div>
    </div>
    <div class="topbar-actions">
      <div class="tb-search">
        <span class="tb-search-icon">🔍</span>
        <input placeholder="بحث...">
      </div>
      <div class="tb-btn" onclick="showToast('لا توجد إشعارات جديدة')">🔔<span class="tb-notif"></span></div>
      <div class="tb-btn" onclick="showToast('الإعدادات قريباً!')">⚙️</div>
      <a href="index.html" class="btn btn-outline btn-sm">🌐 الموقع</a>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="main-content"></div>
</div>
</div>

<div id="toast"></div>

<script>
// ══ DATA ══════════════════════════════════════════════════════════════════════
const roles = {
  admin:      { name:'محمد الإداري',   role:'مدير النظام',    avatar:'م', color:'linear-gradient(135deg,#EF4444,#F59E0B)' },
  instructor: { name:'أحمد الراشد',    role:'مدرّب معتمد',    avatar:'أ', color:'linear-gradient(135deg,#3B82F6,#6366F1)' },
  student:    { name:'خالد الشمري',    role:'طالب مسجّل',     avatar:'خ', color:'linear-gradient(135deg,#10B981,#059669)' },
};

const navConfigs = {
  admin: [
    { section:'الرئيسية', items:[
      { id:'overview',    icon:'📊', label:'نظرة عامة' },
      { id:'analytics',   icon:'📈', label:'التحليلات' },
    ]},
    { section:'الإدارة', items:[
      { id:'courses',     icon:'📚', label:'الدورات',    badge:'12', badgeType:'gold' },
      { id:'users',       icon:'👥', label:'المستخدمون' },
      { id:'payments',    icon:'💳', label:'المدفوعات' },
    ]},
    { section:'النظام', items:[
      { id:'support',     icon:'🎫', label:'الدعم',      badge:'5', badgeType:'red' },
      { id:'settings',    icon:'⚙️', label:'الإعدادات' },
    ]},
  ],
  instructor: [
    { section:'الرئيسية', items:[
      { id:'overview',    icon:'📊', label:'نظرة عامة' },
      { id:'earnings',    icon:'💰', label:'الأرباح' },
    ]},
    { section:'المحتوى', items:[
      { id:'courses',     icon:'📚', label:'دوراتي' },
      { id:'students',    icon:'👥', label:'طلابي' },
      { id:'reviews',     icon:'⭐', label:'التقييمات' },
    ]},
    { section:'الأدوات', items:[
      { id:'coupons',     icon:'🏷️', label:'الكوبونات' },
      { id:'settings',    icon:'⚙️', label:'الإعدادات' },
    ]},
  ],
  student: [
    { section:'الرئيسية', items:[
      { id:'overview',    icon:'🏠', label:'الرئيسية' },
      { id:'mylearning',  icon:'📖', label:'تعلّمي' },
    ]},
    { section:'إنجازاتي', items:[
      { id:'certificates',icon:'🏆', label:'شهاداتي' },
      { id:'wishlist',    icon:'❤️', label:'المفضّلة' },
    ]},
    { section:'الحساب', items:[
      { id:'purchases',   icon:'🧾', label:'مشترياتي' },
      { id:'settings',    icon:'⚙️', label:'الإعدادات' },
    ]},
  ],
};

let currentRole = 'admin';
let currentPage = 'overview';

// ══ RENDER NAV ════════════════════════════════════════════════════════════════
function renderNav(role) {
  const nav = document.getElementById('sb-nav');
  const cfg = navConfigs[role];
  nav.innerHTML = cfg.map(section => `
    <div class="sb-section">${section.section}</div>
    ${section.items.map(item => `
      <div class="sb-item${currentPage===item.id?' active':''}" onclick="navigate('${item.id}')">
        <span class="sb-icon">${item.icon}</span>
        <span>${item.label}</span>
        ${item.badge ? `<span class="sb-badge${item.badgeType==='gold'?'-gold':''}">${item.badge}</span>` : ''}
      </div>
    `).join('')}
  `).join('');
}

// ══ SWITCH ROLE ═══════════════════════════════════════════════════════════════
function switchRole(role) {
  currentRole = role;
  currentPage = 'overview';
  ['admin','instructor','student'].forEach(r => {
    document.getElementById('pill-'+r).className = 'role-pill' + (r===role?' active':'');
  });
  const u = roles[role];
  document.getElementById('sb-avatar').textContent = u.avatar;
  document.getElementById('sb-avatar').style.background = u.color;
  document.getElementById('sb-name').textContent = u.name;
  document.getElementById('sb-role-txt').textContent = u.role;
  renderNav(role);
  navigate('overview');
}

// ══ NAVIGATE ══════════════════════════════════════════════════════════════════
function navigate(page) {
  currentPage = page;
  renderNav(currentRole);
  const titles = {
    overview:'نظرة عامة', analytics:'التحليلات', courses:'الدورات',
    users:'المستخدمون', payments:'المدفوعات', support:'الدعم',
    settings:'الإعدادات', earnings:'الأرباح', students:'طلابي',
    reviews:'التقييمات', coupons:'الكوبونات', mylearning:'تعلّمي',
    certificates:'شهاداتي', wishlist:'المفضّلة', purchases:'مشترياتي',
  };
  const breads = { admin:'لوحة الإدارة', instructor:'لوحة المدرّب', student:'لوحة الطالب' };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('page-bread').textContent = breads[currentRole];
  const content = document.getElementById('main-content');
  content.style.opacity='0';
  content.style.transform='translateY(8px)';
  setTimeout(() => {
    renderPage(currentRole, page);
    content.style.transition='all .3s ease';
    content.style.opacity='1';
    content.style.transform='translateY(0)';
  }, 150);
}

// ══ RENDER PAGE ═══════════════════════════════════════════════════════════════
function renderPage(role, page) {
  const c = document.getElementById('main-content');
  if (role==='admin') c.innerHTML = adminPages[page] || adminPages.overview;
  else if (role==='instructor') c.innerHTML = instructorPages[page] || instructorPages.overview;
  else c.innerHTML = studentPages[page] || studentPages.overview;
  // Animate bars after render
  setTimeout(animateBars, 100);
}

// ══ CHART HELPERS ═════════════════════════════════════════════════════════════
function barChart(data, color='var(--gold)') {
  const max = Math.max(...data.map(d=>d.v));
  return `<div class="bar-chart">${data.map(d=>`
    <div class="bar-wrap">
      <div class="bar-val">${d.v>=1000?(d.v/1000).toFixed(1)+'k':d.v}</div>
      <div class="bar" style="height:0%;background:${typeof color==='function'?color(d):color}" data-h="${Math.round((d.v/max)*100)}"></div>
      <div class="bar-lbl">${d.l}</div>
    </div>
  `).join('')}</div>`;
}

function animateBars() {
  document.querySelectorAll('.bar[data-h]').forEach(b => {
    setTimeout(()=>{ b.style.height = b.dataset.h+'%'; }, 50);
  });
}

function donut(val, label, segments) {
  const total = segments.reduce((s,x)=>s+x.v,0);
  let offset = 0;
  const r=54, circ=2*Math.PI*r;
  const paths = segments.map(seg=>{
    const pct = seg.v/total;
    const dash = pct*circ;
    const path = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${seg.c}" stroke-width="10" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset*circ}" stroke-linecap="round"/>`;
    offset += pct;
    return path;
  }).join('');
  return `
    <div class="donut-wrap">
      <div class="donut">
        <svg viewBox="0 0 120 120" width="120" height="120">${paths}</svg>
        <div class="donut-center"><div class="donut-val">${val}</div><div class="donut-lbl">${label}</div></div>
      </div>
      <div class="donut-legend">${segments.map(s=>`
        <div class="donut-item"><div class="donut-dot" style="background:${s.c}"></div><span style="flex:1;color:var(--t2)">${s.l}</span><span style="font-weight:700">${s.v}%</span></div>
      `).join('')}</div>
    </div>`;
}

// ══ TOAST ═════════════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(60px)';
  }, 3000);
}
